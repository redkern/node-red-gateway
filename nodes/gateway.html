<script type="text/markdown" data-help-name="redkern-gateway-server-config">
Starts the central Gateway WebSocket listener with bounded connections and payloads.

### Inputs
This configuration node does not receive messages.
### Outputs
This configuration node does not send messages.
### Details
The bind host is required. TLS uses the private key and certificate credentials together. Add account nodes and local executors before enabling client requests.
Health endpoints are available at `/healthz/live` and `/healthz/ready` on the WebSocket port.
### References
- [Node-RED creating nodes](https://nodered.org/docs/creating-nodes/)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-account">
Defines one authenticated client and the operation prefixes it may call.

### Inputs
This configuration node does not receive messages.
### Outputs
This configuration node does not send messages.
### Details
Store tokens in the password fields. A next token can overlap during rotation. `domain/*` includes nested operations; an exact name grants one operation, and `*` grants all operations.
### References
- [Node-RED credentials](https://nodered.org/docs/creating-nodes/credentials)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-client-config">
Connects one POD process session to a Gateway over WebSocket.

### Inputs
This configuration node does not receive messages.
### Outputs
This configuration node does not send messages.
### Details
Tokens are sent in the `Authorization` upgrade header. A new random `sessionId` is created for each Node-RED process start.
### References
- [Node-RED configuration nodes](https://nodered.org/docs/creating-nodes/config-nodes)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-api-config">
Stores one upstream HTTP API address, method, and optional token credential.

### Inputs
This configuration node does not receive messages.
### Outputs
This configuration node does not send messages.
### Details
The API token is stored as a password credential. Adapter requests cannot override the configured authorization header.
### References
- [Node-RED credentials](https://nodered.org/docs/creating-nodes/credentials)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-call">
Calls one named Gateway operation and returns its response on the first output.

### Inputs
<dl class="message-properties">
<dt>payload <span class="property-type">any</span></dt><dd>Request data forwarded to the local executor.</dd>
<dt class="optional">redkern.gateway <span class="property-type">object</span></dt><dd>Idempotency key and narrower queue, execution, and total deadline budgets.</dd>
</dl>
### Outputs
<ol class="node-ports">
<li>Result<dl class="message-properties"><dt>payload <span class="property-type">any</span></dt><dd>Executor response; other message properties are preserved.</dd></dl></li>
<li>Error<dl class="message-properties"><dt>error <span class="property-type">object</span></dt><dd>Node-RED error containing the Gateway code and retryable flag.</dd></dl></li>
</ol>
### Details
Configure one `domain/action` operation. Input budgets may only reduce configured maxima. No request is buffered while the POD is disconnected.
### References
- [Node-RED node status and errors](https://nodered.org/docs/creating-nodes/node-js)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-out">
Submits an asynchronous Gateway operation event for delivery to a matching Gateway in node.

### Inputs
<dl class="message-properties"><dt>payload <span class="property-type">any</span></dt><dd>Event data sent to the operation executor.</dd><dt class="optional">redkern.gateway.idempotencyKey <span class="property-type">string</span></dt><dd>Optional key supplied by the flow.</dd></dl>
### Outputs
This sink node does not send messages.
### Details
Use a matching in node to receive the result. Durable delivery across Gateway restarts requires the Redis result-stream stage, which is not part of this alpha runtime.
### References
- [Node-RED sending messages](https://nodered.org/docs/creating-nodes/node-js)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-in">
Emits results for one asynchronous Gateway operation.

### Inputs
This source node does not receive messages.
### Outputs
<dl class="message-properties"><dt>payload <span class="property-type">any</span></dt><dd>Result returned by the operation.</dd><dt>redkern.gateway <span class="property-type">object</span></dt><dd>Request ID and operation name.</dd></dl>
### Details
The current alpha routes event results to the connected client session. Redis-backed durable result streams and cross-session replay remain future work.
### References
- [Node-RED sending messages](https://nodered.org/docs/creating-nodes/node-js)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-adapter">
Registers a local HTTP adapter for one Gateway operation.

### Inputs
This configuration node does not receive messages.
### Outputs
This configuration node does not send messages.
### Details
The adapter uses the API configuration, applies request query, path, and headers, and enforces response size and timeout limits. Pre-send connection failures and HTTP 429 may retry for every class. Post-send transient errors retry only when the operation is configured as <code>safe</code> or <code>idempotent</code>; <code>never</code> prevents those retries. Terminal failures are written to the Gateway Server dead-letter stream up to its configured delivery and retention limits.
### References
- [Node-RED configuration nodes](https://nodered.org/docs/creating-nodes/config-nodes)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-worker-in">
Receives calls for one operation and starts the corresponding local flow.

### Inputs
This source node does not receive messages.
### Outputs
<dl class="message-properties"><dt>payload <span class="property-type">any</span></dt><dd>Request payload.</dd><dt>redkern.gateway <span class="property-type">object</span></dt><dd>Request ID, operation, idempotency key, deadline, and attempt.</dd></dl>
### Details
Connect this node to shared flow logic and finish the path with a matching worker-out node. Worker execution should be idempotent because a process failure can cause at-least-once delivery. Pre-send connection failures and HTTP 429 may retry for every class; post-send transient errors require <code>safe</code> or <code>idempotent</code>. Terminal failures are retained in the Gateway Server dead-letter stream.
### References
- [Node-RED sending messages](https://nodered.org/docs/creating-nodes/node-js)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-worker-out">
Completes the matching Gateway worker request with the incoming message.

### Inputs
<dl class="message-properties"><dt>redkern.gateway.requestId <span class="property-type">string</span></dt><dd>Correlation ID copied from worker-in.</dd><dt>payload <span class="property-type">any</span></dt><dd>Response returned to the caller.</dd></dl>
### Outputs
This sink node does not send messages.
### Details
The configured operation must match the worker-in operation that created the request.
### References
- [Node-RED message properties](https://nodered.org/docs/creating-nodes/)
</script>

<script type="text/markdown" data-help-name="redkern-gateway-metrics">
Outputs Gateway lifecycle and latency events from the configured Gateway Server.

### Inputs
This source node does not receive messages.
### Outputs
<dl class="message-properties"><dt>payload <span class="property-type">object</span></dt><dd>Event metadata, also available as <code>msg.metric</code>.</dd><dt>topic <span class="property-type">string</span></dt><dd><code>pod-gateway/&lt;event&gt;</code>.</dd><dt>gateway <span class="property-type">object</span></dt><dd>Stable event, request, operation, status, and timestamp fields.</dd></dl>
### Details
Leave the event filter empty for all events, or enter a comma-separated list such as <code>request.completed, upstream.completed</code>. Events contain no request payloads, headers, or credentials. The separate token-protected internal endpoint exposes Prometheus text metrics.
### References
- [Node-RED message properties](https://nodered.org/docs/creating-nodes/)
</script>
